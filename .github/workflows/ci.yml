name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint self-test
        run: node tools/kraft-lint/selftest.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :kraft-ui:testDebugUnitTest :kraft-core:testDebugUnitTest --no-daemon

      - name: Quality gate
        run: node tools/kraft-lint/kraft-lint.js . --quiet
